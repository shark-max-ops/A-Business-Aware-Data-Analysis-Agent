[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metric-pilot"
version = "0.1.0"
description = "Business-aware data analysis agent — stage 0 foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/metric_pilot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = [".cache", ".venv", "参考", ".agents", "frontend/node_modules"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
