<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title description">
<title id="title">当前 Agent Harness 框架：接入、循环、证据与记录</title>
<desc id="description">阶段三实际实现。API 固定依赖，Worker 领取运行，Runtime 组织上下文、模型和工具循环。工具访问固定知识、schema 与安全 SQL；成功查询生成冻结产物。观测、状态存储与 SSE 独立展示。报告属于阶段四。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#64758c"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#26826b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#25364a} .muted{fill:#607085} .label{font-size:19px;fill:#607085} .edge{fill:none;stroke:#64758c;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#arrow)} .feedback{fill:none;stroke:#26826b;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#green)}</style>
<rect width="1500" height="1180" fill="#fff"/>

<text x="40" y="51" font-size="36" font-weight="650" style="fill:#25364a">Agent Harness · 当前框架</text>
<text x="40" y="88" font-size="23" font-weight="400" style="fill:#607085">模型选择下一步；服务端控制执行、版本、预算和证据。</text>
